# Este projeto e SOMENTE Android. Nao existe pasta /ios neste repositorio
# e este arquivo define um UNICO workflow, que roda em uma maquina Linux
# (onde nao ha Xcode, portanto e fisicamente impossivel tentar um build
# iOS a partir deste workflow).
workflows:
  android:
    name: Ônibus Sítio Floresta - Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Instalar dependências
        script: flutter pub get
      - name: Rodar testes
        script: flutter test
      - name: Gerar APK release
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
